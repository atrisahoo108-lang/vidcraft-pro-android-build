name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project File & Move Files
        run: |
          unzip -o *.zip
          # If files are inside a subfolder, move them to current directory
          if [ -dVidcraft* ] || [ -d vidcraft* ] || [ $(ls -d */ | wc -l) -eq 1 ]; then
            mv */* . 2>/dev/null || true
            mv */.* . 2>/dev/null || true
          fi
          ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build --if-present

      - name: Build Android App with Capacitor
        run: |
          npx cap add android || true
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidcraft-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
